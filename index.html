<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Фиксим тему Telegram -->
    <meta name="theme-color" content="#FFFFFF">
    <meta name="color-scheme" content="light only">
    
    <title>StyleBox - Твой стиль</title>
    <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <div class="header-top">
                <h1 class="logo">Style<span>Box</span></h1>
                <div class="header-actions">
                    <button class="icon-btn" id="themeToggle">🌙</button>
                    <button class="menu-btn" id="menuToggle">☰</button>
                </div>
            </div>



<!-- Добавь это после товара дня, но до категорий -->
<div class="search-section">
    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Поиск одежды...">
        <button class="search-clear" id="searchClear" style="display: none;">✕</button>
    </div>
</div>


            
            <!-- Боковое меню (единственная навигация) -->
            <div class="side-menu" id="sideMenu">
                <div class="menu-header">
                    <h3>Меню</h3>
                    <button class="close-menu" id="closeMenu">✕</button>
                </div>
                <div class="menu-content">
                    <div class="user-profile">
                        <div class="user-avatar" id="userAvatar">👤</div>
                        <div class="user-name" id="userName">Гость</div>
                    </div>





                    
                    <div class="menu-items">
                        <div class="menu-item active" data-page="main">
                            <span>🏠</span> Главная
                        </div>
                        <div class="menu-item" data-page="wishlist">
                            <span>❤️</span> Избранное 
                            <span class="menu-badge" id="wishlistBadge">0</span>
                        </div>
                        <div class="menu-item" data-page="recent">
                            <span>⏱️</span> Недавние
                        </div>
                        <div class="menu-item" data-page="deals">
                            <span>🔥</span> Скидки
                        </div>
                        <div class="menu-item" data-page="profile">
                            <span>👤</span> Профиль
                        </div>
                        <div class="menu-item" data-page="settings">
                            <span>⚙️</span> Настройки
                        </div>
                        <div class="menu-item" data-page="support">
                            <span>🆘</span> Поддержка
                        </div>
                    </div>
                    
                    <div class="menu-footer">
                        <div class="points-display">
                            <span>⭐ Бонусы:</span>
                            <span class="points-value" id="pointsDisplay">0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Оверлей -->
            <div class="menu-overlay" id="menuOverlay"></div>
        </header>

        <!-- Основной контент -->
        <main class="main-content" id="mainContent">
            <!-- Сюда будет загружаться контент -->
        </main>

       <!-- Нижняя панель с бонусами и корзиной -->
<div class="bottom-panel">
    <div class="bonus-widget">
        <span class="bonus-icon">⭐</span>
        <span class="bonus-amount" id="bottomBonus">0</span>
    </div>
    <button class="cart-btn-panel" id="bottomCartBtn">
        🛒 <span class="cart-badge-panel" id="bottomCartBadge">0</span>
    </button>
</div>

        <!-- Боковая корзина -->
        <div class="cart-sidebar" id="cartSidebar">
            <div class="cart-header">
                <h2>🛒 Корзина</h2>
                <button class="close-cart" id="closeCart">✕</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Итого:</span>
                    <span class="total-price" id="cartTotal">0 ₽</span>
                </div>
                <button class="checkout-btn" id="checkoutBtn">Оформить заказ</button>
                <button class="clear-cart-btn" id="clearCartBtn">Очистить</button>
            </div>
        </div>

        <!-- Модальное окно товара -->
        <div class="modal" id="productModal">
            <div class="modal-content">
                <button class="close-modal" onclick="closeModal()">✕</button>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>
    </div>

    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Наш скрипт -->
    <script src="script.js?v=3.0"></script>
</body>
</html>
