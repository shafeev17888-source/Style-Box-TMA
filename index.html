<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleBox - Твой стиль</title>
    <!-- Принудительное обновление кэша -->
    <link rel="stylesheet" href="style.css?v=2.0">
    <!-- Запасной вариант на случай ошибки -->
    <style>
        /* Базовые стили на случай если CSS не загрузится */
        body { margin: 0; font-family: Arial; background: #f5f5f5; }
        .debug-info { 
            background: #ff6b6b; 
            color: white; 
            padding: 10px; 
            text-align: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <!-- Отладочное сообщение -->
    <div class="debug-info" id="debugMessage">
        🔍 Загрузка StyleBox... Если видишь это сообщение - CSS не загрузился
    </div>

    <div class="app">
        <!-- Шапка с меню -->
        <header class="header">
            <div class="header-top">
                <h1 class="logo">Style<span>Box</span></h1>
                <div class="header-actions">
                    <button class="icon-btn" id="themeToggle">🌙</button>
                    <button class="icon-btn" id="menuToggle">☰</button>
                    <button class="cart-icon" id="cartToggle">
                        🛒 <span class="cart-badge" id="navCartBadge">0</span>
                    </button>
                </div>
            </div>
            
            <!-- Боковое меню -->
            <div class="side-menu" id="sideMenu">
                <div class="menu-header">
                    <h3>Меню</h3>
                    <button class="close-menu" id="closeMenu">✕</button>
                </div>
                <div class="menu-content">
                    <div class="user-profile">
                        <div class="user-avatar" id="userAvatar">👤</div>
                        <div class="user-name" id="userName">Гость</div>
                    </div>
                    
                    <div class="menu-items">
                        <div class="menu-item active" data-page="main">
                            <span>🏠</span> Главная
                        </div>
                        <div class="menu-item" data-page="wishlist">
                            <span>❤️</span> Избранное 
                            <span class="menu-badge" id="wishlistBadge">0</span>
                        </div>
                        <div class="menu-item" data-page="recent">
                            <span>⏱️</span> Недавние
                        </div>
                        <div class="menu-item" data-page="deals">
                            <span>🔥</span> Скидки
                        </div>
                        <div class="menu-item" data-page="profile">
                            <span>👤</span> Профиль
                        </div>
                        <div class="menu-item" data-page="settings">
                            <span>⚙️</span> Настройки
                        </div>
                    </div>
                    
                    <div class="menu-footer">
                        <div class="points-balance">
                            <span>💎 Бонусы:</span>
                            <span class="points-value" id="pointsDisplay">0</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Оверлей -->
            <div class="menu-overlay" id="menuOverlay"></div>
        </header>

        <!-- Основной контент -->
        <main class="main-content" id="mainContent">
            <!-- Сюда будет загружаться контент -->
        </main>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav">
            <div class="nav-item active" data-page="main">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Главная</span>
            </div>
            <div class="nav-item" data-page="wishlist">
                <span class="nav-icon">❤️</span>
                <span class="nav-label">Избранное</span>
                <span class="nav-badge" id="navWishlistBadge">0</span>
            </div>
            <div class="nav-item" data-page="deals">
                <span class="nav-icon">🔥</span>
                <span class="nav-label">Скидки</span>
            </div>
            <div class="nav-item" data-page="cart">
                <span class="nav-icon">🛒</span>
                <span class="nav-label">Корзина</span>
                <span class="nav-badge" id="navCartBadge">0</span>
            </div>
            <div class="nav-item" data-page="profile">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Профиль</span>
            </div>
        </nav>

        <!-- Боковая корзина -->
        <div class="cart-sidebar" id="cartSidebar">
            <div class="cart-header">
                <h2>🛒 Корзина</h2>
                <button class="close-cart" id="closeCart">✕</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-footer">
                <div class="cart-total">
                    <span>Итого:</span>
                    <span class="total-price" id="cartTotal">0 ₽</span>
                </div>
                <button class="checkout-btn" id="checkoutBtn">Оформить заказ</button>
                <button class="clear-cart-btn" id="clearCartBtn">Очистить</button>
            </div>
        </div>

        <!-- Модальное окно товара -->
        <div class="modal" id="productModal">
            <div class="modal-content">
                <button class="close-modal" onclick="closeModal()">✕</button>
                <div class="modal-body" id="modalBody"></div>
            </div>
        </div>
    </div>

    <!-- Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Наш скрипт с версией для сброса кэша -->
    <script src="script.js?v=2.0"></script>
    
    <script>
        // Убираем отладочное сообщение после загрузки
        window.addEventListener('load', function() {
            setTimeout(function() {
                const debug = document.getElementById('debugMessage');
                if (debug) debug.style.display = 'none';
            }, 2000);
        });
    </script>
</body>
</html>
