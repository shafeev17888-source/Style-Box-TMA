<!DOCTYPE html>
<html>
<head>
    <title>StyleBox - Модная одежда</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <header>
            <h1>👕 StyleBox</h1>
            <p>Найди свой стиль!</p>
        </header>

        <!-- Корзина -->
        <div class="cart-section">
            <h2>🛒 Корзина: <span id="cart-count">0</span> товаров</h2>
            <button onclick="showCart()">Посмотреть корзину</button>
            <button onclick="clearCart()">Очистить</button>
        </div>

        <!-- Фильтры -->
        <div class="filters">
            <button onclick="filterProducts('all')">Всё</button>
            <button onclick="filterProducts('shirts')">Футболки</button>
            <button onclick="filterProducts('pants')">Штаны</button>
            <button onclick="filterProducts('shoes')">Обувь</button>
        </div>

        <!-- Товары -->
        <div class="products" id="products-container">
            <!-- Товары появятся здесь с помощью JavaScript -->
        </div>

        <!-- Попап корзины -->
        <div class="popup" id="cart-popup">
            <div class="popup-content">
                <h2>🛒 Ваша корзина</h2>
                <div id="cart-items"></div>
                <button onclick="closeCart()">Закрыть</button>
                <button onclick="buyNow()" class="buy-btn">Купить сейчас!</button>
            </div>
        </div>

        <!-- Футер -->
        <footer>
            <p>StyleBox © 2025 - Подбор модной одежды</p>
            <p>Для Telegram Mini Apps</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
